services:
  db:
    image: postgres:16-alpine
    container_name: enerlytix_db
    environment:
      POSTGRES_DB: enerlytix
      POSTGRES_USER: enerlytix_user
      POSTGRES_PASSWORD: enerlytix_password
    ports:
      - "54322:54322"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enerlytix_user -d enerlytix"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enerlytix_network

  web:
    build:
      context: ../../
      dockerfile: django_app/docker/Dockerfile
    container_name: enerlytix_web
    command: python manage.py runserver 0.0.0.0:8080
    env_file:
      - ../../.env
    volumes:
      - ../../django_app:/app
    ports:
      - "8080:8080"
    environment:
      DEBUG: "True"
      DATABASE_URL: postgresql://enerlytix_user:enerlytix_password@db:5432/enerlytix
      DJANGO_SETTINGS_MODULE: config.settings
    depends_on:
      db:
        condition: service_healthy
    networks:
      - enerlytix_network

volumes:
  postgres_data:

networks:
  enerlytix_network:
    driver: bridge

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saved Reports | Enerlytix</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #f4f7fa;
            color: #1f2937;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.9rem 1.2rem;
            background: #ffffff;
            border-bottom: 1px solid #d6dee6;
        }
        .topbar a {
            color: #334155;
            text-decoration: none;
            margin-left: 0.9rem;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1rem;
        }
        .panel {
            background: #ffffff;
            border: 1px solid #d6dee6;
            border-radius: 0.6rem;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.06);
            padding: 1rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 0.65rem 0.5rem;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.9rem;
        }
        th {
            font-size: 0.77rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #475569;
        }
        .status-pill {
            display: inline-block;
            border-radius: 999px;
            padding: 0.18rem 0.55rem;
            font-size: 0.76rem;
            font-weight: 700;
        }
        .status-draft { background: #dbeafe; color: #1e3a8a; }
        .status-final { background: #dcfce7; color: #166534; }
        .open-link {
            color: #0369a1;
            font-weight: 700;
            text-decoration: none;
        }
        .empty {
            color: #64748b;
            padding: 0.75rem 0.2rem;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <strong>Enerlytix</strong>
        <div>
            <a href="{% url 'sitesync:site_list' %}">Dashboard</a>
            <a href="{% url 'sitesync:report' %}">Report</a>
            <a href="{% url 'sitesync:saved_reports' %}">Saved Reports</a>
        </div>
    </div>

    <div class="page">
        <div class="panel">
            <h1>Saved Reports</h1>
            <p>Browse draft and final monthly reports by site and reporting month.</p>
            <div id="saved-reports-empty" class="empty" style="display:none;">No saved reports found.</div>
            <table id="saved-reports-table" aria-live="polite">
                <thead>
                    <tr>
                        <th>Site</th>
                        <th>Reporting Month</th>
                        <th>Status</th>
                        <th>Updated</th>
                        <th>Open</th>
                    </tr>
                </thead>
                <tbody id="saved-reports-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        window.ENERLYTIX_SAVED_REPORTS_CONTEXT = {
            reports: {{ reports_json|safe }},
            selectedSiteId: {{ selected_site_id|default:'null' }}
        };
    </script>
    <script src="{% static 'sitesync/js/saved_reports.js' %}"></script>
</body>
</html>

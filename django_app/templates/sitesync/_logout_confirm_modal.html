<div id="logoutConfirmModal" class="logout-modal" hidden>
    <div class="logout-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="logoutConfirmTitle">
        <h2 id="logoutConfirmTitle">Confirm logout</h2>
        <p>Are you sure you want to sign out?</p>
        <div class="logout-modal-actions">
            <button type="button" class="logout-cancel-btn js-close-logout-modal">Cancel</button>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="logout-confirm-btn">Logout</button>
            </form>
        </div>
    </div>
</div>

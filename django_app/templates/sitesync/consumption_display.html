<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Consumption Display</title>
    <style>
        body { font-family: "Segoe UI", Tahoma, sans-serif; margin: 24px; background: #f7f9fc; color: #1f2937; }
        .panel { background: #fff; border: 1px solid #dbe3ef; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
        .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
        label { font-size: 12px; font-weight: 600; color: #334155; display: block; margin-bottom: 6px; }
        input, select { min-width: 160px; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; }
        button { padding: 8px 14px; border: none; border-radius: 6px; background: #0f766e; color: #fff; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; }
        th, td { border-bottom: 1px solid #e2e8f0; padding: 10px; text-align: left; font-size: 14px; }
        th { background: #ecfeff; color: #134e4a; }
        .empty { color: #64748b; margin-top: 10px; }
        @media (max-width: 640px) { body { margin: 12px; } th, td { font-size: 12px; padding: 8px; } }
    </style>
</head>
<body>
    <div class="panel">
        <h2>Imported Usage and Invoice Records</h2>
        <div class="row">
            <div>
                <label for="reporting-month">Reporting Month</label>
                <input id="reporting-month" type="month" value="{{ reporting_month }}" />
            </div>
            <div>
                <label for="supply-id">Supply</label>
                <select id="supply-id">
                    <option value="">All</option>
                    {% for supply in supplies %}
                        <option value="{{ supply.external_id }}" {% if supply.external_id == supply_id %}selected{% endif %}>{{ supply.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="data-type">Data Type</label>
                <select id="data-type">
                    <option value="monthly" {% if data_type == 'monthly' %}selected{% endif %}>Monthly</option>
                    <option value="halfhourly" {% if data_type == 'halfhourly' %}selected{% endif %}>Half-hourly</option>
                    <option value="invoice" {% if data_type == 'invoice' %}selected{% endif %}>Invoice</option>
                </select>
            </div>
            <div>
                <button id="load-data" type="button">Load</button>
            </div>
        </div>
        <p id="summary" class="empty"></p>
    </div>

    <div class="panel">
        <table>
            <thead>
                <tr>
                    <th>Supply</th>
                    <th>Source Start</th>
                    <th>Source End</th>
                    <th>Canonical Month</th>
                    <th>Value</th>
                    <th>Type</th>
                </tr>
            </thead>
            <tbody id="records-body"></tbody>
        </table>
        <p id="empty-state" class="empty">Select filters and click Load.</p>
    </div>

    <script src="/static/sitesync/js/consumption_display.js"></script>
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enerlytix Report</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="{% static 'sitesync/cxg-base.css' %}" rel="stylesheet">
    <style>
        :root {
            --cxg-bg-10: #F2F2F3;
            --cxg-bg-25: #DEE0E3;
            --cxg-primary-430: #7C878E;
            --cxg-primary-432: #333F48;
            --cxg-highlight-376: #7AB800;
            --cxg-highlight-349: #00693C;
            --cxg-border: #C6D0D7;
            --cxg-white: #FFFFFF;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Manrope', 'Segoe UI', sans-serif;
            color: var(--cxg-primary-432);
            background:
                radial-gradient(circle at top left, rgba(122, 184, 0, 0.12), transparent 24%),
                linear-gradient(180deg, #f8faf7 0%, var(--cxg-bg-10) 50%, #eef2f5 100%);
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            padding: 0.85rem 1.4rem;
            border-bottom: 1px solid var(--cxg-border);
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .brand { font-size: 1.15rem; font-weight: 800; }
        .topbar-links { display: flex; gap: 1.1rem; flex-wrap: wrap; }
        .topbar-links a {
            color: var(--cxg-primary-430);
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 0.3rem 0.15rem;
            border-bottom: 2px solid transparent;
        }
        .topbar-links a.is-active { color: var(--cxg-primary-432); border-bottom-color: var(--cxg-primary-430); }

        .page {
            width: min(1500px, 100%);
            margin: 0 auto;
            padding: 1rem;
        }

        .hero {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            align-items: flex-start;
            background: var(--cxg-white);
            border: 1px solid var(--cxg-border);
            border-radius: 0.7rem;
            padding: 1rem 1.1rem;
            box-shadow: 0 10px 30px rgba(51, 63, 72, 0.08);
            margin-bottom: 1rem;
        }

        .hero h1 { margin: 0 0 0.35rem; font-size: 1.65rem; }
        .hero p { margin: 0; color: #5b7080; font-size: 0.92rem; }

        .hero-actions {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .button {
            border: none;
            border-radius: 0.45rem;
            padding: 0.62rem 0.9rem;
            font: inherit;
            font-size: 0.84rem;
            font-weight: 700;
            cursor: pointer;
        }

        .button-primary {
            background: var(--cxg-highlight-376);
            color: var(--cxg-primary-432);
        }

        .button-secondary {
            background: var(--cxg-primary-432);
            color: var(--cxg-white);
        }

        .report-layout {
            display: grid;
            grid-template-columns: 18rem minmax(0, 1fr);
            gap: 1rem;
            align-items: start;
        }

        .nav-panel,
        .content-panel {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid var(--cxg-border);
            border-radius: 0.7rem;
            box-shadow: 0 10px 24px rgba(51, 63, 72, 0.06);
        }

        .nav-panel {
            position: sticky;
            top: 5rem;
            padding: 0.9rem;
        }

        .nav-panel h2,
        .section h2 { margin: 0 0 0.7rem; font-size: 1rem; }

        .nav-list { display: grid; gap: 0.4rem; }
        .nav-list a {
            display: block;
            text-decoration: none;
            color: var(--cxg-primary-432);
            background: var(--cxg-bg-10);
            border: 1px solid transparent;
            border-radius: 0.45rem;
            padding: 0.62rem 0.75rem;
            font-size: 0.84rem;
            font-weight: 600;
        }

        .nav-list a:hover { border-color: var(--cxg-primary-430); }

        .content-panel {
            padding: 1rem;
            min-width: 0;
        }

        .report-meta {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
            color: #5b7080;
            font-size: 0.86rem;
        }

        .cover-editor {
            border: 1px solid var(--cxg-border);
            border-radius: 0.65rem;
            background: #f8fafb;
            padding: 0.9rem;
            margin-bottom: 1rem;
        }

        .cover-editor h3 {
            margin: 0 0 0.65rem;
            font-size: 0.95rem;
        }

        .cover-editor-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.75rem;
        }

        .cover-editor-field {
            display: grid;
            gap: 0.3rem;
            align-content: start;
        }

        .cover-editor-field label {
            font-size: 0.76rem;
            font-weight: 700;
            color: #4f6473;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .cover-editor-field input,
        .cover-editor-field textarea {
            width: 100%;
            border: 1px solid var(--cxg-border);
            border-radius: 0.45rem;
            padding: 0.52rem 0.58rem;
            font: inherit;
            font-size: 0.84rem;
            background: #fff;
        }

        .cover-editor-field textarea {
            min-height: 6.5rem;
            resize: vertical;
        }

        .cover-validation-message {
            margin-top: 0.4rem;
            font-size: 0.78rem;
            color: #7d2e2e;
            min-height: 1.2em;
        }

        .cover-editor-field input[type="file"] {
            min-height: 2.55rem;
            display: flex;
            align-items: center;
        }

        .cover-editor-field-file {
            grid-template-rows: auto auto 1.2em;
        }

        .cover-editor-field-file .cover-validation-message {
            margin-top: 0;
        }

        .cover-page {
            overflow: hidden;
            min-height: 30rem;
            padding: 0;
            aspect-ratio: 16 / 9;
        }

        .section-card.cover-page {
            border: none !important;
            background: transparent !important;
            box-shadow: none !important;
            border-radius: 0 !important;
            margin-bottom: 0.85rem;
        }

        .cover-page-front {
            display: grid;
            grid-template-columns: 33% 67%;
            min-height: 100%;
            height: 100%;
        }

        .cover-front-left {
            background: #283848;
            color: #fff;
            padding: 2.55rem 1.9rem 2rem;
            position: relative;
            display: grid;
            grid-template-rows: auto auto auto auto auto 1fr auto;
            align-content: start;
            gap: 0.62rem;
        }

        .cover-front-brand {
            display: inline-flex;
            align-items: center;
            justify-content: flex-start;
            min-height: 2.35rem;
            margin-bottom: 0.35rem;
        }

        .cover-front-brand img {
            height: 2.45rem;
            width: auto;
            object-fit: contain;
        }

        .cover-front-box {
            border: none;
            border-radius: 0;
            padding: 0;
            font-size: 1.22rem;
            font-weight: 800;
            line-height: 1.04;
            text-transform: uppercase;
            letter-spacing: 0.035em;
            max-width: 100%;
            white-space: normal;
            word-break: break-word;
        }

        .cover-front-site-title {
            max-width: 12.2rem;
            font-size: 1.74rem;
            line-height: 0.96;
            letter-spacing: 0.055em;
        }

        .cover-front-site-rule {
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #5da6d8 0%, #7AB800 100%);
            margin-top: -0.02rem;
            margin-bottom: 0.62rem;
        }

        .cover-front-month-title {
            max-width: 13.2rem;
            font-size: 1.06rem;
        }

        .cover-front-date {
            font-size: 0.76rem;
            font-weight: 600;
            letter-spacing: 0.035em;
            text-transform: none;
            max-width: 10rem;
        }

        .cover-front-logo {
            display: none;
            height: 0;
            overflow: hidden;
            margin-top: 0;
        }

        .cover-front-logo.is-visible {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            height: 4rem;
            overflow: hidden;
            align-self: end;
            margin-top: 0.5rem;
            background: rgba(255, 255, 255, 0.04);
        }

        .cover-front-logo img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }

        .cover-front-image {
            min-height: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }

        .cover-page-two {
            padding: 2.9rem 1.7rem 1.7rem;
            background: #fff;
            height: 100%;
        }

        .cover-page-two-brand {
            margin-bottom: 1.95rem;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            min-height: 2.25rem;
        }

        .cover-page-two-brand img {
            height: 2.15rem;
            width: auto;
            object-fit: contain;
        }

        .cover-page-two h3 {
            margin: 1.05rem 0 0.45rem;
            font-size: 1.44rem;
            letter-spacing: 0.02em;
        }

        .cover-page-two p,
        .cover-page-two li {
            font-size: 0.89rem;
            line-height: 1.42;
        }

        .cover-page-back {
            min-height: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }

        .empty-state {
            padding: 1rem;
            border: 1px dashed var(--cxg-border);
            border-radius: 0.6rem;
            background: rgba(242, 242, 243, 0.8);
            color: #5b7080;
        }

        .section { margin-bottom: 1.1rem; }
        .section-card {
            border: none;
            border-radius: 0;
            background: var(--cxg-white);
            padding: 0.95rem;
            margin-bottom: 0.8rem;
        }

        .section-grid { display: grid; gap: 0.8rem; }
        .metric-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 0.75rem;
        }

        .metric {
            border-radius: 0.55rem;
            padding: 0.7rem;
            background: #f7faf8;
            border: 1px solid #deebdf;
        }

        .metric-label { color: var(--cxg-primary-430); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 800; }
        .metric-value { margin-top: 0.2rem; font-size: 1.15rem; font-weight: 800; }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border-bottom: 1px solid #e2e8f0;
            padding: 0.55rem 0.5rem;
            text-align: left;
            font-size: 0.82rem;
            vertical-align: top;
        }

        th {
            background: #f4f8fb;
            color: #134e4a;
            font-size: 0.74rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .chart-box {
            position: relative;
            height: 16rem;
            border-radius: 0.55rem;
            background: linear-gradient(180deg, #fafcf8 0%, #eef5ea 100%);
            border: 1px solid #dce7d7;
            overflow: hidden;
        }

        .comment-box {
            width: 100%;
            min-height: 4.5rem;
            resize: vertical;
            border-radius: 0.45rem;
            border: 1px solid var(--cxg-border);
            padding: 0.7rem;
            font: inherit;
        }

        .is-exporting .comment-box::placeholder {
            color: transparent;
        }

        /* During PDF export: remove comment-box styling so text reads like a paragraph */
        .is-exporting .comment-box {
            color: var(--cxg-primary-432);
            border: none;
            background: transparent;
            resize: none;
            padding: 0.6rem 0 0 0;
            min-height: 0;
            font-size: 0.86rem;
            line-height: 1.65;
        }

        /* Clean white section cards — remove gradients, shadows, and rounded corners */
        .is-exporting .section-card {
            background: #ffffff;
            border: 1px solid #d8e4ec;
            box-shadow: none;
            border-radius: 2px;
        }

        .is-exporting .section-card.cover-page {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            border-radius: 0 !important;
            padding: 0 !important;
            margin-bottom: 0.85rem !important;
        }

        /* Clean up chart canvas containers */
        .is-exporting .chart-canvas-wrapper {
            background: #ffffff !important;
            border-color: #d8e4ec !important;
            border-radius: 2px !important;
        }

        /* Cleaner metric cards */
        .is-exporting .metric {
            background: #f8fafb;
            border-color: #d8e4ec;
            border-radius: 2px;
        }

        /* Cleaner table headers */
        .is-exporting th {
            background: #f4f6f8;
            color: #333F48;
        }

        /* Hide the HTML card headings during PDF export — the title/subtitle
           are already rendered inside the Chart.js canvas. */
        .is-exporting .card-title-screen,
        .is-exporting .card-subtitle-screen {
            display: none;
        }

        @media (max-width: 1180px) {
            .report-layout { grid-template-columns: 1fr; }
            .nav-panel { position: static; }
            .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media print {
            .topbar, .hero-actions, .nav-panel { display: none !important; }
            body { background: #fff; }
            .page { width: 100%; padding: 0; }
            .report-layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    {% include 'sitesync/_topbar.html' with active_page='reports' %}

    <div class="page">
        <div class="hero">
            <div>
                <h1>Report Visuals</h1>
                <p id="report-subtitle">Generating report...</p>
            </div>
            <div class="hero-actions">
                <button id="save-draft-button" class="button button-primary" type="button">Save Draft</button>
                <button id="save-final-button" class="button button-secondary" type="button">Save Final</button>
                <button id="download-pdf-button" class="button button-secondary" type="button">Download as PDF</button>
                <button id="download-pptx-button" class="button button-secondary" type="button">Download as PPTX</button>
            </div>
        </div>

        <div class="report-layout">
            <aside class="nav-panel">
                <h2>Sections</h2>
                <div id="report-nav" class="nav-list"></div>
            </aside>

            <main class="content-panel">
                <section id="cover-editor" class="cover-editor" aria-label="Report cover editor">
                    <h3>Cover Page Editor</h3>
                    <div class="cover-editor-grid">
                        <div class="cover-editor-field">
                            <label for="cover-site-title-input">Front Cover Site Title</label>
                            <input id="cover-site-title-input" type="text" />
                        </div>
                        <div class="cover-editor-field">
                            <label for="cover-month-title-input">Front Cover Report Title</label>
                            <input id="cover-month-title-input" type="text" />
                        </div>
                        <div class="cover-editor-field">
                            <label for="cover-date-input">Front Cover Date</label>
                            <input id="cover-date-input" type="text" />
                        </div>
                        <div class="cover-editor-field cover-editor-field-file">
                            <label for="cover-logo-upload-input">Client Logo (PNG/JPG/SVG, up to 2 MB)</label>
                            <input id="cover-logo-upload-input" type="file" accept=".png,.jpg,.jpeg,.svg,image/png,image/jpeg,image/svg+xml" />
                            <div id="cover-logo-validation" class="cover-validation-message" aria-live="polite"></div>
                        </div>
                        <div class="cover-editor-field" style="grid-column: 1 / -1;">
                            <label for="cover-background-upload-input">Front Cover Background (JPG/JPEG/PNG/WebP, up to 10 MB)</label>
                            <input id="cover-background-upload-input" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" />
                            <div id="cover-background-validation" class="cover-validation-message" aria-live="polite"></div>
                        </div>
                        <div class="cover-editor-field">
                            <label for="cover-scope-title-input">Second Cover Scope Title</label>
                            <input id="cover-scope-title-input" type="text" />
                        </div>
                        <div class="cover-editor-field" style="grid-column: 1 / -1;">
                            <label for="cover-scope-body-input">Second Cover Scope Body</label>
                            <textarea id="cover-scope-body-input"></textarea>
                        </div>
                        <div class="cover-editor-field">
                            <label for="cover-contents-title-input">Second Cover Contents Title</label>
                            <input id="cover-contents-title-input" type="text" />
                        </div>
                        <div class="cover-editor-field" style="grid-column: 1 / -1;">
                            <label for="cover-contents-body-input">Second Cover Contents Lines (one per line)</label>
                            <textarea id="cover-contents-body-input"></textarea>
                        </div>
                    </div>
                </section>
                <div class="report-meta" id="report-meta"></div>
                <div id="report-empty" class="empty-state">Loading report...</div>
                <div id="report-sections" class="section-grid" aria-live="polite"></div>
            </main>
        </div>
    </div>

    {{ report_context|json_script:"enerlytix-report-context" }}
    <script>
        (function () {
            const contextElement = document.getElementById('enerlytix-report-context');
            window.ENERLYTIX_REPORT_CONTEXT = contextElement
                ? JSON.parse(contextElement.textContent)
                : {};
        }());
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <script src="{% static 'sitesync/js/report.js' %}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ brand_name }} Invitation</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333F48;">
  <h2>You are invited to {{ brand_name }}</h2>
  <p>Hello,</p>
  <p>You have been invited to join {{ brand_name }}.</p>
  <p>
    <a href="{{ action_url }}" style="background: #7AB800; color: #333F48; padding: 10px 14px; text-decoration: none; font-weight: bold; border-radius: 4px;">Accept invitation</a>
  </p>
  <p>If the button does not work, copy and paste this link:</p>
  <p><a href="{{ action_url }}">{{ action_url }}</a></p>
  {% if support_reply_to %}
  <p>Need help? Reply to {{ support_reply_to }}.</p>
  {% endif %}
</body>
</html>

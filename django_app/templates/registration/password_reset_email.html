<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Password reset</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333F48;">
  <h2>Password reset</h2>
  <p>A password reset was requested for your {{ brand_name|default:"Enerlytix" }} account.</p>
  <p>
    <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}" style="background: #7AB800; color: #333F48; padding: 10px 14px; text-decoration: none; font-weight: bold; border-radius: 4px;">Set new password</a>
  </p>
  <p>If you did not request this, you can ignore this email.</p>
</body>
</html>
